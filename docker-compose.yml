services:
  db:
    image: postgres:16-alpine
    container_name: reading-diploma-db
    environment:
      POSTGRES_DB: rdiploma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rdiploma"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reading-diploma-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: rdiploma
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "3001:3001"

volumes:
  postgres_data:
